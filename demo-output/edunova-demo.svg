<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      .slide { opacity: 0; animation: cycle 18s infinite; }
      .slide1 { animation-delay: 0s; }
      .slide2 { animation-delay: 6s; }
      .slide3 { animation-delay: 12s; }
      .title { font: 700 64px 'Segoe UI', sans-serif; fill: #E5EEF9; letter-spacing: -2px; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #7DD3FC; letter-spacing: 4px; text-transform: uppercase; }
      .body { font: 400 21px 'Segoe UI', sans-serif; fill: #A4B3C8; }
      .small { font: 600 14px 'Segoe UI', sans-serif; fill: #D9E7F7; }
      .muted { fill: #A4B3C8; }
      .pill { fill: rgba(124,58,237,0.12); stroke: rgba(124,58,237,0.28); }
      .panel { fill: rgba(15,23,42,0.9); stroke: rgba(148,163,184,0.18); }
      .on { fill: #FBBF24; }
      .light { fill: rgba(148,163,184,0.1); }
      @keyframes cycle {
        0%, 26% { opacity: 1; }
        33%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1000" cy="90" r="220" fill="rgba(124,58,237,0.12)"/>
  <circle cx="220" cy="650" r="220" fill="rgba(34,197,94,0.08)"/>

  <g class="slide slide1" filter="url(#shadow)">
    <rect x="48" y="40" width="1184" height="640" rx="28" fill="rgba(15,23,42,0.7)" stroke="rgba(148,163,184,0.2)"/>
    <g>
      <rect x="102" y="96" width="36" height="36" rx="12" fill="url(#primary)"/>
      <text x="150" y="124" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">EduNova</text>
      <text x="102" y="205" class="subtitle">Smart Student Learning Platform</text>
      <text x="102" y="278" class="title">Master web development</text>
      <text x="102" y="340" class="title">with a plan that fits your week.</text>
      <text x="102" y="390" class="body">Real video lessons, timed quizzes, a study planner, and</text>
      <text x="102" y="420" class="body">verifiable certificates—designed to keep students moving.</text>

      <g>
        <rect x="102" y="455" width="180" height="54" rx="16" fill="url(#primary)"/>
        <text x="150" y="490" fill="white" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Start Learning</text>
      </g>

      <g>
        <rect x="300" y="455" width="200" height="54" rx="16" fill="rgba(148,163,184,0.08)" stroke="rgba(148,163,184,0.2)"/>
        <text x="400" y="490" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Verify Certificate</text>
      </g>
    </g>

    <g transform="translate(810 110)">
      <rect x="0" y="0" width="340" height="430" rx="24" fill="rgba(15,23,42,0.88)" stroke="rgba(148,163,184,0.18)"/>
      <rect x="30" y="26" width="280" height="52" rx="14" fill="rgba(124,58,237,0.11)" stroke="rgba(124,58,237,0.18)"/>
      <text x="170" y="58" text-anchor="middle" class="small" fill="#E5EEF9">TRENDING</text>

      <rect x="24" y="106" width="292" height="110" rx="18" fill="rgba(15,23,42,0.9)" stroke="rgba(148,163,184,0.14)"/>
      <text x="42" y="144" class="small" fill="#E5EEF9">Full Stack Bootcamp</text>
      <text x="272" y="144" class="small" fill="#FBBF24">4.9</text>
      <rect x="42" y="166" width="180" height="12" rx="6" fill="url(#primary)"/>
      <rect x="42" y="188" width="120" height="12" rx="6" fill="rgba(148,163,184,0.4)"/>

      <rect x="24" y="240" width="292" height="110" rx="18" fill="rgba(15,23,42,0.9)" stroke="rgba(148,163,184,0.14)"/>
      <text x="42" y="278" class="small" fill="#E5EEF9">Modern JavaScript</text>
      <text x="272" y="278" class="small" fill="#7DD3FC">4.8</text>
      <rect x="42" y="302" width="210" height="12" rx="6" fill="url(#primary)"/>
      <rect x="42" y="324" width="160" height="12" rx="6" fill="rgba(148,163,184,0.4)"/>

      <g>
        <rect x="24" y="370" width="82" height="36" rx="12" fill="rgba(34,197,94,0.15)"/>
        <rect x="116" y="370" width="82" height="36" rx="12" fill="rgba(59,130,246,0.15)"/>
        <rect x="208" y="370" width="82" height="36" rx="12" fill="rgba(251,191,36,0.12)"/>
      </g>
    </g>

    <g transform="translate(110 520)">
      <g>
        <rect x="0" y="0" width="166" height="90" rx="18" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.14)"/>
        <text x="28" y="35" font-size="26" fill="#E5EEF9" font-family="Segoe UI, sans-serif">9+</text>
        <text x="28" y="62" class="body" fill="#A4B3C8">Courses</text>
      </g>
      <g transform="translate(180 0)">
        <rect x="0" y="0" width="166" height="90" rx="18" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.14)"/>
        <text x="28" y="35" font-size="26" fill="#E5EEF9" font-family="Segoe UI, sans-serif">500+</text>
        <text x="28" y="62" class="body" fill="#A4B3C8">Students</text>
      </g>
      <g transform="translate(360 0)">
        <rect x="0" y="0" width="166" height="90" rx="18" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.14)"/>
        <text x="28" y="35" font-size="26" fill="#E5EEF9" font-family="Segoe UI, sans-serif">27+</text>
        <text x="28" y="62" class="body" fill="#A4B3C8">Lessons</text>
      </g>
      <g transform="translate(540 0)">
        <rect x="0" y="0" width="166" height="90" rx="18" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.14)"/>
        <text x="28" y="35" font-size="26" fill="#E5EEF9" font-family="Segoe UI, sans-serif">4.7</text>
        <text x="28" y="62" class="body" fill="#A4B3C8">Rating</text>
      </g>
    </g>
  </g>

  <g class="slide slide2" filter="url(#shadow)">
    <rect x="48" y="40" width="1184" height="640" rx="28" fill="rgba(15,23,42,0.7)" stroke="rgba(148,163,184,0.2)"/>
    <g>
      <text x="104" y="150" class="subtitle">Learning Workflow</text>
      <text x="104" y="230" class="title" font-size="58">Study smarter with</text>
      <text x="104" y="292" class="title" font-size="58">personalized progress tracking.</text>

      <g transform="translate(100 340)">
        <rect x="0" y="0" width="540" height="84" rx="18" fill="rgba(15,23,42,0.82)" stroke="rgba(148,163,184,0.14)"/>
        <rect x="20" y="20" width="44" height="44" rx="14" fill="rgba(124,58,237,0.22)"/>
        <text x="88" y="38" font-size="24" font-weight="700" fill="#E5EEF9" font-family="Segoe UI, sans-serif">Video lessons</text>
        <text x="88" y="63" font-size="18" fill="#A4B3C8" font-family="Segoe UI, sans-serif">Learn with clear sessions and practical examples.</text>
      </g>

      <g transform="translate(100 440)">
        <rect x="0" y="0" width="540" height="84" rx="18" fill="rgba(15,23,42,0.82)" stroke="rgba(148,163,184,0.14)"/>
        <rect x="20" y="20" width="44" height="44" rx="14" fill="rgba(34,197,94,0.2)"/>
        <text x="88" y="38" font-size="24" font-weight="700" fill="#E5EEF9" font-family="Segoe UI, sans-serif">Instant quiz feedback</text>
        <text x="88" y="63" font-size="18" fill="#A4B3C8" font-family="Segoe UI, sans-serif">Identify weak spots and track improvement faster.</text>
      </g>
    </g>

    <g transform="translate(782 96)">
      <rect x="0" y="0" width="400" height="470" rx="24" fill="rgba(15,23,42,0.88)" stroke="rgba(148,163,184,0.18)"/>
      <text x="30" y="48" font-size="18" fill="#CFFAFE" font-family="Segoe UI, sans-serif" font-weight="700">DASHBOARD</text>
      <text x="308" y="48" font-size="14" fill="#7DD3FC" font-family="Segoe UI, sans-serif" font-weight="700">LIVE</text>

      <circle cx="200" cy="180" r="110" fill="none" stroke="rgba(148,163,184,0.15)" stroke-width="18"/>
      <circle cx="200" cy="180" r="110" fill="none" stroke="url(#primary)" stroke-width="18" stroke-linecap="round" transform="rotate(-90 200 180)" stroke-dasharray="560" stroke-dashoffset="155"/>
      <text x="200" y="185" text-anchor="middle" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="42" font-weight="800">72%</text>
      <text x="200" y="220" text-anchor="middle" fill="#A4B3C8" font-family="Segoe UI, sans-serif" font-size="17">Overall progress</text>

      <rect x="30" y="285" width="340" height="122" rx="18" fill="rgba(15,23,42,0.8)" stroke="rgba(148,163,184,0.14)"/>
      <text x="50" y="320" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Continue learning</text>
      <rect x="50" y="338" width="220" height="12" rx="6" fill="url(#primary)"/>
      <rect x="50" y="358" width="170" height="12" rx="6" fill="rgba(148,163,184,0.35)"/>
      <text x="300" y="320" fill="#7DD3FC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">View all</text>
    </g>
  </g>

  <g class="slide slide3" filter="url(#shadow)">
    <rect x="48" y="40" width="1184" height="640" rx="28" fill="rgba(15,23,42,0.7)" stroke="rgba(148,163,184,0.2)"/>
    <g>
      <text x="104" y="150" class="subtitle">Student impact</text>
      <text x="104" y="228" class="title" font-size="58">A platform built for</text>
      <text x="104" y="288" class="title" font-size="58">confidence, accountability, and outcomes.</text>
      <text x="104" y="342" class="body">From beginner to job-ready, EduNova helps students learn at their own pace while tracking</text>
      <text x="104" y="372" class="body">milestones, badges, and verifiable certificates on the way to their goals.</text>

      <rect x="104" y="430" width="515" height="120" rx="18" fill="rgba(15,23,42,0.8)" stroke="rgba(148,163,184,0.14)"/>
      <text x="132" y="474" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="23">“The study planner kept me accountable. I completed three courses in two months and landed my dream role.”</text>
      <circle cx="156" cy="515" r="18" fill="url(#green)"/>
      <text x="186" y="521" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Priya Mehta</text>
      <text x="186" y="545" fill="#A4B3C8" font-family="Segoe UI, sans-serif" font-size="14">Full Stack Developer</text>
    </g>

    <g transform="translate(785 100)">
      <rect x="0" y="0" width="350" height="420" rx="24" fill="rgba(15,23,42,0.88)" stroke="rgba(148,163,184,0.18)"/>
      <text x="30" y="42" fill="#CFFAFE" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">CERTIFICATE</text>
      <text x="298" y="42" fill="#7DD3FC" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">VERIFIED</text>

      <rect x="30" y="76" width="290" height="266" rx="22" fill="rgba(124,58,237,0.08)" stroke="rgba(124,58,237,0.18)"/>
      <text x="175" y="118" text-anchor="middle" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="26" font-weight="800">EduNova</text>
      <text x="175" y="170" text-anchor="middle" fill="#E5EEF9" font-family="Segoe UI, sans-serif" font-size="34" font-weight="700">Web Fundamentals</text>
      <rect x="86" y="192" width="178" height="4" fill="url(#primary)"/>
      <text x="175" y="228" text-anchor="middle" fill="#A4B3C8" font-family="Segoe UI, sans-serif" font-size="16">Student</text>
      <text x="175" y="256" text-anchor="middle" fill="#A4B3C8" font-family="Segoe UI, sans-serif" font-size="14">Completed</text>

      <g transform="translate(35 360)">
        <rect x="0" y="0" width="80" height="34" rx="12" fill="rgba(124,58,237,0.2)"/>
        <rect x="95" y="0" width="80" height="34" rx="12" fill="rgba(34,197,94,0.2)"/>
        <rect x="190" y="0" width="80" height="34" rx="12" fill="rgba(59,130,246,0.18)"/>
      </g>
    </g>
  </g>
</svg>
